spring.application.name=MathClass

# ==========================================
# PostgreSQL Configuration
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA and Hibernate properties
# ==========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# Gmail SMTP Configuration
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# Supabase Configuration
# ==========================================
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}

# ==========================================
# Google Auth Configuration
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

# ==========================================
# JWT Configuration
# ==========================================
mathclass.app.jwtSecret=${JWT_SECRET}
mathclass.app.jwtExpirationMs=900000
mathclass.app.jwtRefreshExpirationMs=604800000
mathclass.app.jwtCookieName=mathclass_jwt
mathclass.app.jwtRefreshCookieName=mathclass_jwt_refresh
mathclass.app.apiPrefix=/api/v1

# ==========================================
# Database Seeding Configuration
# ==========================================
mathclass.seed.enabled=true

# ==========================================
# Swagger / OpenAPI Configuration
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

# ==========================================
# Infisical Secret Management Configuration
# ==========================================
mathclass.infisical.enabled=${INFISICAL_ENABLED:false}
mathclass.infisical.host=${INFISICAL_HOST:https://app.infisical.com}
mathclass.infisical.client-id=${INFISICAL_CLIENT_ID:}
mathclass.infisical.client-secret=${INFISICAL_CLIENT_SECRET:}
mathclass.infisical.project-id=${INFISICAL_PROJECT_ID:}
mathclass.infisical.environment=${INFISICAL_ENV:dev}
mathclass.infisical.secret-path=${INFISICAL_SECRET_PATH:/}
mathclass.infisical.secret-name=${INFISICAL_SECRET_NAME:AI_ENCRYPTION_MASTER_KEY}

# ==========================================
# AI Security Encryption Key (Fallback)
# ==========================================
app.security.ai-encryption-key=${AI_ENCRYPTION_MASTER_KEY:MathClassSecretKeyForAiEncryption32B!}

# ==========================================
# Cloud Storage Cleanup (Garbage Collector)
# ==========================================
app.storage.cleanup.enabled=true
app.storage.cleanup.cron=0 0 3 * * SUN
app.storage.cleanup.grace-period-hours=24


