<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email-layout :: html}">
<body>
    <th:block th:fragment="content">
        <h2>Xin chào <span th:text="${fullName}">Bạn</span>,</h2>
        <p>Chúng tôi nhận được yêu cầu khôi phục mật khẩu cho tài khoản của bạn trên hệ thống MathClass.</p>
        <p>Vui lòng click vào nút bên dưới để đặt lại mật khẩu của bạn. Link này sẽ hết hạn trong vòng 15 phút.</p>
        <div style="text-align: center;">
            <a th:href="${resetLink}" class="btn" style="color: #ffffff;">Đặt lại mật khẩu</a>
        </div>
        <p>Nếu bạn không yêu cầu khôi phục mật khẩu, xin hãy bỏ qua email này.</p>
    </th:block>
</body>
</html>
