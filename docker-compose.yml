services:
  backend:
    build:
      context: .
      target: builder
    container_name: math-class-backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env
      - ./src:/app/src
      - ./build.gradle:/app/build.gradle
      - ./settings.gradle:/app/settings.gradle
      - ./gradlew:/app/gradlew
      - ./gradle:/app/gradle
    command: ./gradlew bootRun --continuous
    environment:
      # 1. Đổi url kết nối sang jdbc:postgresql, dùng cổng 5432 và đúng tên DB biến môi trường
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # 2. Đổi image sang postgresql
    image: postgres:16-alpine
    container_name: math-class-db
    environment:
      # 3. Đổi tên các biến môi trường tương ứng của Postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Postgres mặc định dùng cổng 5432 ở cả máy thật và container
    volumes:
      - db_data:/var/lib/postgresql/data # Đổi đường dẫn lưu data của Postgres
    # 4. Sửa lại lệnh kiểm tra trạng thái (Healthcheck) phù hợp với Postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
